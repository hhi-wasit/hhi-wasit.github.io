<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الخبر – المعهد الصحي العالي واسط</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="images/logo.jpg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .post-shell { max-width: 900px; margin: 0 auto; }
    .post-article { background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-md); overflow: hidden; }
    .post-heading { padding: 2.5rem 3rem 1.5rem; }
    .post-heading h1 { margin: .7rem 0 1rem; font-size: clamp(1.8rem, 4vw, 2.8rem); }
    .post-category { display:inline-block; color:var(--teal); background:var(--teal-pale); padding:.3rem .8rem; border-radius:20px; font-weight:700; }
    .post-meta { display:flex; flex-wrap:wrap; gap:1.2rem; color:var(--gray); font-size:.9rem; }
    .post-meta i { color:var(--teal); margin-left:.35rem; }
    .post-content { padding: 1rem 3rem 2rem; color:var(--gray-dark); font-size:1.08rem; line-height:2; white-space:pre-wrap; }
    .post-gallery { padding: 0 3rem 2.5rem; }
    .post-gallery-title { color:var(--navy); font-size:1.25rem; margin:0 0 1rem; padding-top:1rem; border-top:1px solid var(--border); }
    .post-images { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:1rem; }
    .post-image { width:100%; aspect-ratio:4 / 3; object-fit:cover; background:var(--gray-light); border-radius:8px; border:1px solid var(--border); }
    .post-actions { display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; padding:1.2rem 3rem; border-top:1px solid var(--border); background:var(--gray-light); }
    .copy-status { color:var(--teal); font-size:.9rem; align-self:center; }
    .post-error { text-align:center; padding:4rem 1rem; }
    @media (max-width:600px) {
      .post-heading,.post-gallery,.post-content,.post-actions { padding-left:1.2rem; padding-right:1.2rem; }
      .post-images { grid-template-columns:1fr; }
    }
  </style>
</head>
<body class="rtl">
<header id="site-header"></header>
<section class="page-hero"><div class="container"><h1>تفاصيل الخبر</h1><p>آخر أخبار ومستجدات معهد الصحة العالي / واسط</p></div></section>
<section class="section">
  <div class="container post-shell">
    <div id="loadingPost" style="text-align:center;padding:4rem;color:var(--gray)"><i class="fas fa-spinner fa-spin fa-2x"></i><p>جارٍ تحميل الخبر...</p></div>
    <div id="postError" class="post-error" style="display:none"><i class="fas fa-newspaper fa-3x" style="color:var(--teal);margin-bottom:1rem"></i><h2>الخبر غير موجود</h2><p>تعذر العثور على هذا الخبر.</p><a class="btn btn-secondary" href="news.html">العودة إلى الأخبار</a></div>
    <article id="postArticle" class="post-article" style="display:none">
      <div class="post-heading"><span id="postCategory" class="post-category"></span><h1 id="postTitle"></h1><div class="post-meta"><span><i class="fas fa-calendar-alt"></i><span id="postDate"></span></span><span><i class="fas fa-user"></i><span id="postAuthor"></span></span></div></div>
      <div id="postBody" class="post-content"></div>
      <div id="postGallery" class="post-gallery" style="display:none"><h2 class="post-gallery-title">صور الخبر</h2><div id="postImages" class="post-images"></div></div>
      <div class="post-actions"><a class="btn btn-secondary btn-sm" href="news.html"><i class="fas fa-arrow-right"></i> العودة إلى الأخبار</a><div><button id="copyLinkBtn" class="btn btn-navy btn-sm" type="button"><i class="fas fa-link"></i> نسخ رابط الخبر</button><span id="copyStatus" class="copy-status" role="status"></span></div></div>
    </article>
  </div>
</section>
<footer id="site-footer"></footer>
<script src="js/app.js"></script><script src="js/layout.js"></script>
<script>
const catLabels = {'منشآت':'منشآت','فعاليات':'فعاليات','أكاديمي':'أكاديمي','شراكات':'شراكات','تدريب':'تدريب','عام':'عام'};
function getImages(n) { if (n.images && Array.isArray(n.images) && n.images.length) return n.images; return n.image ? [n.image] : []; }
function showError() { document.getElementById('loadingPost').style.display='none'; document.getElementById('postError').style.display='block'; }
async function loadPost() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) return showError();
  try {
    const news = await HHI.getNews();
    const n = news.find(item => String(item.id) === String(id));
    if (!n) return showError();
    const imgs = getImages(n);
    document.getElementById('postCategory').textContent=catLabels[n.category]||n.category||'عام';
    document.getElementById('postTitle').textContent=n.title;
    document.getElementById('postDate').textContent=formatDate(n.date);
    document.getElementById('postAuthor').textContent=n.author||'الإدارة';
    document.getElementById('postBody').textContent=n.body||'';
    if (imgs.length) { document.getElementById('postGallery').style.display='block'; document.getElementById('postImages').innerHTML=imgs.map((src,i)=>`<img src="${escHtml(src)}" class="post-image" alt="${escHtml(n.title)} - صورة ${i+1}" loading="lazy">`).join(''); }
    document.getElementById('loadingPost').style.display='none'; document.getElementById('postArticle').style.display='block'; document.title=n.title+' – المعهد الصحي العالي واسط';
  } catch (e) { showError(); }
}
document.getElementById('copyLinkBtn').addEventListener('click', async () => { const status=document.getElementById('copyStatus'); try { await navigator.clipboard.writeText(window.location.href); status.textContent='تم نسخ الرابط'; } catch(e) { status.textContent='انسخ الرابط من شريط العنوان'; } setTimeout(()=>status.textContent='',3000); });
renderHeader('news.html'); renderFooter(); loadPost();
</script>
</body>
</html>
